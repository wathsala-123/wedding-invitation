<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wathsala & Anuruddha Wedding Invitation</title>
    <!-- Crisp High-Quality Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a09; color: #3d3011; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; padding: 15px; }

        /* Falling Gold Petals */
        #petal-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; }
        .petal { position: absolute; background: linear-gradient(135deg, #ffd700, #b8860b); border-radius: 12px 0 12px 0; opacity: 0.85; animation: fall linear infinite; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* Envelope Cover */
        .envelope-wrapper { position: relative; width: 100%; max-width: 400px; height: 260px; background: #16140f; border-radius: 12px; border: 2px solid #d4af37; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 12px 35px rgba(0,0,0,0.9); z-index: 10; }
        .envelope-seal { width: 80px; height: 80px; background: linear-gradient(135deg, #d4af37, #996515); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-family: 'Cinzel', serif; font-size: 26px; font-weight: bold; border: 2px solid #fff8e7; box-shadow: 0 0 20px rgba(212,175,55,0.7); animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .tap-text { margin-top: 18px; color: #d4af37; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-family: 'Cinzel', serif; }

        /* Photo Walking Motion Layer */
        .couple-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 100; justify-content: center; align-items: center; overflow: hidden; }
        .couple-box { width: 85%; max-width: 330px; border-radius: 16px; overflow: hidden; border: 2px solid #d4af37; box-shadow: 0 0 35px rgba(212,175,55,0.6); animation: walkForward 3.2s forwards ease-in-out; }
        .couple-box img { width: 100%; display: block; object-fit: cover; }

        @keyframes walkForward {
            0% { transform: scale(0.6) translateY(100px); opacity: 0; }
            20% { opacity: 1; }
            60% { transform: scale(0.98) translateY(10px); }
            85% { transform: scale(1.06) translateY(-5px); opacity: 1; }
            100% { transform: scale(1.18) translateY(-25px); opacity: 0; }
        }

        /* Card Replica */
        .card-container { display: none; width: 100%; max-width: 430px; background: linear-gradient(180deg, #eae1cd 0%, #d5c097 100%); border-radius: 6px; padding: 35px 22px; border: 2px solid #b38f46; box-shadow: 0 0 30px rgba(0,0,0,0.5); text-align: center; position: relative; opacity: 0; transform: translateY(20px); transition: all 0.8s ease; }
        .card-container.show { display: block; opacity: 1; transform: translateY(0); }

        /* WA Logo with Leaf Wreath */
        .wreath-box { position: relative; width: 85px; height: 85px; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; }
        .wreath-svg { position: absolute; width: 100%; height: 100%; fill: none; stroke: #735317; stroke-width: 1.5; }
        .monogram-text { font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700; color: #5a400f; z-index: 2; margin-top: 2px; }

        /* Text Styling */
        .text-parents { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; color: #3d2f0d; letter-spacing: 0.8px; line-height: 1.6; text-transform: uppercase; }
        .text-together { font-size: 9px; font-weight: 700; color: #705318; margin: 4px 0; letter-spacing: 1.2px; }
        .text-request { font-size: 8.5px; font-weight: 700; color: #3d2f0d; letter-spacing: 1px; margin: 14px 0 8px 0; text-transform: uppercase; }
        .guest-box { background: rgba(115, 83, 23, 0.12); border: 1.5px solid #735317; padding: 7px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 700; color: #2b2007; display: inline-block; margin: 4px 0; letter-spacing: 0.5px; }
        .text-grace { font-size: 8.5px; font-weight: 700; color: #3d2f0d; letter-spacing: 0.8px; margin: 12px 0 10px 0; text-transform: uppercase; line-height: 1.5; }
        .couple-names { font-family: 'Alex Brush', cursive; font-size: 48px; color: #4d3609; margin: 6px 0 16px 0; font-weight: 500; text-shadow: 0.5px 0.5px 0px rgba(255,255,255,0.8); }

        .details-row { display: flex; justify-content: space-between; align-items: flex-start; text-align: center; border-top: 1px dashed #8c6820; border-bottom: 1px dashed #8c6820; padding: 12px 0; margin: 15px 0 10px 0; font-size: 10px; color: #2b2007; font-weight: 700; }
        .col-item { flex: 1; padding: 0 4px; }
        .col-item:not(:last-child) { border-right: 1px solid #8c6820; }
        .col-item span { display: block; color: #705318; font-size: 8.5px; margin-bottom: 3px; }
        .col-item strong { font-size: 13px; color: #4d3609; font-family: 'Cinzel', serif; }

        .poruwa-text { font-size: 9px; font-weight: 700; color: #3d2f0d; margin: 10px 0 14px 0; text-transform: uppercase; }
        .rsvp-text { font-size: 9px; font-weight: 700; color: #3d2f0d; text-transform: uppercase; line-height: 1.5; }
        .btn-whatsapp { display: inline-block; margin-top: 18px; width: 100%; padding: 12px; background: #5a400f; color: #fff8e7; text-decoration: none; font-weight: 700; font-size: 11px; border-radius: 4px; letter-spacing: 1.5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-transform: uppercase; }
    </style>
</head>
